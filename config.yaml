---
name: Rethink (LG ThinQ local bridge)
version: '1.4.6'
slug: rethink
description: >-
    Local-only server that replaces LG's ThinQ cloud for supported appliances,
    translating their protocol to MQTT for Home Assistant. Optional bridge mode
    mirrors traffic to the real LG cloud too, so the official app keeps working.
url: https://github.com/kshexe/rethink
arch: [amd64, aarch64]
init: false
startup: services
boot: auto
ingress: true
ingress_port: 44401
map:
    - share:rw
ports:
    4433/tcp: 4433
    8886/tcp: 8886
    46030/tcp: 46030
    47878/tcp: 47878
ports_description:
    4433/tcp: ThinQ2 HTTPS (device provisioning)
    8886/tcp: ThinQ2 MQTTS (device connection) - do not change unless you know what you're doing
    46030/tcp: ThinQ1 HTTPS (device provisioning)
    47878/tcp: ThinQ1 device connection
options:
    hostname: rethink.lan
    mqtt_host: core-mosquitto
    mqtt_port: 1883
    mqtt_user: ''
    mqtt_pass: ''
    language: ''
    advertise_requested_host: false
    log: status incoming HTTPS publish MGMT
    frame_log_days: 0
schema:
    hostname: str
    mqtt_host: str
    mqtt_port: port
    mqtt_user: str?
    mqtt_pass: password?
    language: str?
    advertise_requested_host: bool
    log: str?
    frame_log_days: int(0,90)?
